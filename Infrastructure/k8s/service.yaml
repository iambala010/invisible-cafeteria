apiVersion: v1
kind: Service
metadata:
  name: cafeteria-backend-svc
  namespace: invisible-cafeteria
spec:
  type: ClusterIP
  selector:
    app: cafeteria-backend
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: cafeteria-frontend-svc
  namespace: invisible-cafeteria
spec:
  type: ClusterIP
  selector:
    app: cafeteria-frontend
  ports:
  - port: 80
    targetPort: 80

