apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cafeteria-ingress
  namespace: invisible-cafeteria
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: cafeteria.campus.edu
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cafeteria-backend-svc
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cafeteria-frontend-svc
            port:
              number: 80

