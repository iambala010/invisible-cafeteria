apiVersion: v1
kind: Namespace
metadata:
  name: invisible-cafeteria
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-backend
  namespace: invisible-cafeteria
  labels:
    app: cafeteria-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cafeteria-backend
  template:
    metadata:
      labels:
        app: cafeteria-backend
    spec:
      containers:
      - name: backend
        image: invisible-cafeteria-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-frontend
  namespace: invisible-cafeteria
  labels:
    app: cafeteria-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cafeteria-frontend
  template:
    metadata:
      labels:
        app: cafeteria-frontend
    spec:
      containers:
      - name: frontend
        image: invisible-cafeteria-frontend:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"

